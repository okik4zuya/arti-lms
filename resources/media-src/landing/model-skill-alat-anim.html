<div id="fade" style="position:absolute;inset:0;background:#fff;opacity:1;pointer-events:none"></div>

<script>
/* Timeline contract: see ~/.claude/skills/html2media/references/timeline-api.md */
window.DURATION = 10;
window.CUES = [];
const anims = [];
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const $ = (id) => document.getElementById(id);
function A(el, kf, start, dur, ease = EASE) {
  const a = el.animate(kf, { delay: start * 1000, duration: Math.max(dur, .001) * 1000, fill: 'both', easing: ease });
  a.pause(); anims.push(a); return a;
}
// one opacity animation per element: [t0 -> t1] goes a -> b
function fade(el, t0, t1, a, b) { A(el, [{ opacity: a }, { opacity: b }], t0, t1 - t0, 'linear'); }
window.seek = (t) => anims.forEach((x) => { x.currentTime = t * 1000; });

/* loop seam: white overlay, in at start, out at end */
A($('fade'), [{ opacity: 1 }, { opacity: 0, offset: .04 }, { opacity: 0, offset: .94 }, { opacity: 1 }], 0, 10, 'linear');

/* 0-1.8 s: model alone, puzzled */
[['q1', .4, .8], ['q2', .7, 1.1], ['q3', 1.0, 1.4]].forEach(([id, a, b]) =>
  A($(id), [{ opacity: 0 }, { opacity: 0, offset: a / 2.4 }, { opacity: 1, offset: b / 2.4 }, { opacity: 1, offset: 1.9 / 2.4 }, { opacity: 0 }], 0, 2.4, 'linear'));
A($('sweat'), [{ opacity: 1 }, { opacity: 1, offset: 1.9 / 2.4 }, { opacity: 0 }], 0, 2.4, 'linear');

/* 2.0 s: expression and pose change */
fade($('faceBefore'), 2.0, 2.4, 1, 0);
fade($('faceAfter'), 2.0, 2.4, 0, 1);
fade($('armsBefore'), 2.0, 2.4, 1, 0);
fade($('armsAfter'), 2.0, 2.4, 0, 1);
fade($('handL'), 2.0, 2.4, 0, 1);
fade($('handR'), 2.0, 2.4, 0, 1);

/* 2.6-3.6 s: skill sheet arrives from the left */
A($('sheet'), [{ opacity: 0, transform: 'translateX(-160px)' }, { opacity: 1, transform: 'translateX(0)' }], 2.6, 1.0);
/* 4.0-5.0 s: hoe arrives from the right */
A($('hoe'), [{ opacity: 0, transform: 'translateX(160px)' }, { opacity: 1, transform: 'translateX(0)' }], 4.0, 1.0);

/* 5.4 s: withered leftovers go, healthy sprouts grow one by one */
fade($('wilt'), 5.2, 5.7, 1, 0);
['sp1', 'sp2', 'sp3', 'sp4', 'sp5'].forEach((id, i) => {
  A($(id), [{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1 }], 5.6 + i * .45, .7);
});
</script>
